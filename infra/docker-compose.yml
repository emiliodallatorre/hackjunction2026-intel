services:
  physical-ai-studio:
    image: physical-ai-studio-xpu:junction2026
    pull_policy: build
    build:
      context: https://github.com/open-edge-platform/physical-ai-studio.git#285924d9381238d3ef2478294c2b85a0eb6ac62b
      dockerfile: application/docker/Dockerfile
      target: physical-ai-studio-xpu
      additional_contexts:
        libs: https://github.com/open-edge-platform/physical-ai-studio.git#285924d9381238d3ef2478294c2b85a0eb6ac62b:library
    env_file:
      - .env
    container_name: physical-ai-studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      HOST: 0.0.0.0
      PORT: "7860"
      SYCL_CACHE_PERSISTENT: "1"
      SYCL_CACHE_DIR: /app/storage/.sycl-cache
      SYCL_UR_USE_LEVEL_ZERO_V2: "0"
      HF_TOKEN: ${HF_TOKEN:-}
      # Brick anomaly detection: config and model are mounted so host-side `brick-ad` changes apply on restart.
      BRICK_AD_CONFIG: /brick/config.yaml
    volumes:
      - physical-ai-studio-storage:/app/storage
      - ${HOME}/.cache/huggingface/lerobot/calibration:/home/appuser/.cache/huggingface/lerobot/calibration:ro
      # Paths are relative to the repository root (the run script's --project-directory).
      # Config paths resolve against /brick: all model versions are mounted, and paths.model in
      # config.yaml picks one (models/patchcore-v2, or models/patchcore for v1).
      - ./anomaly_detection/config.yaml:/brick/config.yaml:ro
      - ./anomaly_detection/models:/brick/models:ro
      # Privileged containers get /dev nodes but not udev's by-id symlinks used as the camera source.
      - /dev/v4l:/dev/v4l:ro
    group_add:
      - "${DIALOUT_GID:-dialout}"
      - "${PLUGDEV_GID:-plugdev}"
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:?Set RENDER_GID to the numeric group ID of the host Intel GPU render device}"
    ipc: host
    privileged: true
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  physical-ai-studio-storage:
